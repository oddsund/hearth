[package]
name = "hearth"
version = "1.0.0"
edition = "2021"
description = "Tracker-free WoW addon manager"
license = "MIT"

[dependencies]
# A small web server on 127.0.0.1 serves the UI (built into the binary) to a browser app window.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query"] }
tokio-stream = { version = "0.1", default-features = false, features = ["sync"] }
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "net", "time"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
regex = "1"
dirs = "5"
anyhow = "1"
tempfile = "3"
similar = "2"

[profile.release]
strip = true
lto = true
